<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA 7 — Open World 3D Action</title>
    <meta
      name="description"
      content="GTA 7 — Open-world 3D browser action and driving game created by Matti and his buddy. Cruise through a procedural neon city, drift sports cars, and evade the cops!"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas#webgl-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="webgl-canvas"></canvas>
      <div id="hud-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
